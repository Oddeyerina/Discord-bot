services:
  api:
    build: ./api
    env_file: .env
    ports:
      - "${API_HOST_PORT}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  bot:
    build: ./bot
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    env_file: .env
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${WEB_HOST_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
